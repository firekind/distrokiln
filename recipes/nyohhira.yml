# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: distrokiln/nyohhira
description: Personal image for ASUS laptop.
base-image: quay.io/fedora-ostree-desktops/silverblue
image-version: 44
modules:
  - from-file: common/akmod-nvidia-open.yml

  - type: dnf
    repos:
      files:
        - 1password.repo
        - tailscale.repo
    remove:
      packages:
        - firefox
        - firefox-langpacks
        - malcontent-control
        - yelp
        - gnome-tour
    install:
      packages:
        - 1password
        - tailscale

  - type: dnf
    repos:
      cleanup: true
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/6672af7a7125aef3400606dc9da174cfe423a0a1/terra.repo
    install:
      exclude:
        - terra-release
      packages:
        - asusctl
        - rog-control-center

  - from-file: common/nix.yml

  - type: os-release
    properties:
      PRETTY_NAME: nyohhira (Fedora Silverblue)
      DEFAULT_HOSTNAME: nyohhira

  - type: signing
