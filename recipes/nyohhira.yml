# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: distrokiln/nyohhira
description: Personal image for ASUS laptop.
base-image: quay.io/fedora-ostree-desktops/silverblue
image-version: 44
modules:
  - type: akmods
    nvidia-driver: nvidia-open
    install: []

  # selinux policy for nvidia
  - type: script
    snippets:
      - curl -fLsS --retry 5 https://raw.githubusercontent.com/NVIDIA/dgx-selinux/b988ea65e7b43009a705eb5e5d7e94048f916734/bin/RHEL9/nvidia-container.pp -o /tmp/nvidia-container.pp
      - semodule -i /tmp/nvidia-container.pp
      - rm -f /tmp/nvidia-container.pp

  - type: dnf
    repos:
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
        - 1password.repo
    remove:
      packages:
        - firefox
        - firefox-langpacks
        - malcontent-control
        - yelp
        - gnome-tour
    install:
      packages:
        - terra-release
        - asusctl
        - rog-control-center
        - 1password

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - app.zen_browser.zen

  - type: signing
