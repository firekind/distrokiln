# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: distrokiln/nyohhira
description: Personal image for ASUS laptop.
base-image: quay.io/fedora-ostree-desktops/silverblue
image-version: 44
modules:
  - type: akmods
    nvidia-driver: nvidia-open
    install: []

  - type: dnf
    repos:
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
        - 1password.repo
    remove:
      packages:
        - firefox
        - firefox-langpacks
        - malcontent-control
        - yelp
        - gnome-tour
    install:
      packages:
        - terra-release
        - asusctl
        - rog-control-center
        - 1password

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - app.zen_browser.zen

  - type: signing
